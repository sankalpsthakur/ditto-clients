name: Validate PR 278 mechanical review v3
on:
  push:
    branches:
      - validation/pr-278-mechanics-v3-20260922
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8128589fc8e7fbee177bf73ad6695dbb94421f42
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - name: Install pinned workspace
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr278-mechanics-v3
          git rev-parse HEAD HEAD^{tree} > /tmp/pr278-mechanics-v3/source.txt
          { node --version; npm --version; uname -a; } > /tmp/pr278-mechanics-v3/environment.txt
          cd javascript
          npm ci > /tmp/pr278-mechanics-v3/install.log 2>&1
          npm run build > /tmp/pr278-mechanics-v3/base-build.log 2>&1
      - name: Apply previously validated review corrections plus remaining mechanics
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/sankalpsthakur/ditto-clients/d6860bd7fea1a663e8b3d2fbc56d64c01350c0e4/validation/apply_pr278_mechanical.py -o /tmp/apply_v2.py
          echo 'dde7b68ef06f3203d17242ae07dbaaa390b81c6ac6909508f3e169537d6e4bc5  /tmp/apply_v2.py' | sha256sum -c -
          curl -fsSL https://raw.githubusercontent.com/sankalpsthakur/ditto-clients/ef0fa79debc1decb92a98f3f01e54a8a91ca2196/validation/extend_pr278_mechanics_v3.py -o /tmp/apply_v3.py
          sha256sum /tmp/apply_v3.py | tee /tmp/pr278-mechanics-v3/v3-script.sha256
          # The v3 script uses a regex only to locate one existing method block. Feed
          # its replacement through a callable so TypeScript backslashes stay literal.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_v3.py')
          s = p.read_text()
          old = 's, count = pattern.subn(replacement, s, count=1)'
          new = 's, count = pattern.subn(lambda _match: replacement, s, count=1)'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
          sha256sum /tmp/apply_v3.py | tee /tmp/pr278-mechanics-v3/v3-script-effective.sha256
          python3 /tmp/apply_v2.py > /tmp/pr278-mechanics-v3/apply-v2.log 2>&1
          if ! python3 /tmp/apply_v3.py > /tmp/pr278-mechanics-v3/apply-v3.log 2>&1; then
            cat /tmp/pr278-mechanics-v3/apply-v3.log
            exit 1
          fi
          git diff --check
          git diff --binary > /tmp/pr278-mechanics-v3/fix.patch
          sha256sum /tmp/pr278-mechanics-v3/fix.patch | tee /tmp/pr278-mechanics-v3/fix.patch.sha256
          git diff --stat | tee /tmp/pr278-mechanics-v3/diff-stat.txt
          git diff --name-only | tee /tmp/pr278-mechanics-v3/changed-files.txt
          test "$(git diff --name-only | wc -l)" -eq 6
      - name: Run all existing Node workspace tests
        working-directory: javascript/lib/node
        run: |
          set -euo pipefail
          npm test -- --runInBand --json --outputFile=/tmp/pr278-mechanics-v3/after.json > /tmp/pr278-mechanics-v3/after.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/pr278-mechanics-v3/after.json').read_text())
          summary = {k: data[k] for k in ['numTotalTests', 'numPassedTests', 'numFailedTests', 'numPendingTests', 'numTotalTestSuites']}
          print(summary)
          Path('/tmp/pr278-mechanics-v3/test-summary.json').write_text(json.dumps(summary, indent=2))
          assert data['success'] and data['numFailedTests'] == 0 and data['numPendingTests'] == 0
          assert data['numTotalTests'] >= 73 and data['numTotalTestSuites'] >= 5
          PY
      - name: Build and lint changed TypeScript files
        working-directory: javascript
        run: |
          set -euo pipefail
          npm run build --workspace=@eclipse-ditto/ditto-javascript-client-node > /tmp/pr278-mechanics-v3/build.log 2>&1
          npx --no-install eslint lib/node/src/proxy-settings.ts lib/node/src/node-websocket.ts lib/node/tests/proxy-settings.spec.ts lib/node/tests/node-http.spec.ts lib/node/tests/node-websocket.spec.ts > /tmp/pr278-mechanics-v3/lint.log 2>&1
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr278-mechanics-v3-receipts
          path: /tmp/pr278-mechanics-v3
          retention-days: 14
